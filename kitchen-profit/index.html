<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ec4899">
<title>Kitchen Profit</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg:#fff5fa; --surface:#ffffff; --surface-2:#fdeaf3; --line:#fad7e8;
    --text:#3a1f2d; --muted:#a06b85; --faint:#d0a5bc;
    --accent:#ec4899; --accent-2:#f9a8d4; --accent-ink:#ffffff; --accent-soft:#fdeaf4;
    --green:#0f9d6b; --green-soft:#e4f6ee; --red:#e11d48; --red-text:#be123c; --red-soft:#fde7ec;
    --shadow:0 1px 2px rgba(190,60,130,.06), 0 10px 30px rgba(190,60,130,.10);
    --shadow-sm:0 1px 2px rgba(190,60,130,.08);
    --r:22px; --r-sm:14px;
    font-synthesis-weight:none;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1a0f16; --surface:#271620; --surface-2:#32202c; --line:#3e2735;
      --text:#f9ecf3; --muted:#cf9fb6; --faint:#946c81;
      --accent:#f472b6; --accent-2:#f9a8d4; --accent-ink:#2b0f1d; --accent-soft:#3a1b2b;
      --green:#34d399; --green-soft:#133026; --red:#fb7185; --red-text:#fda4af; --red-soft:#3a1420;
      --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.45);
      --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.4;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  main{max-width:520px;margin:0 auto;
    padding:0 16px calc(104px + env(safe-area-inset-bottom));}

  /* app bar */
  .appbar{position:sticky;top:0;z-index:20;max-width:520px;margin:0 auto;
    display:flex;align-items:center;gap:10px;
    padding:max(10px,env(safe-area-inset-top)) 16px 10px;
    background:linear-gradient(var(--bg) 70%, transparent);}
  .appbar img{width:30px;height:30px;border-radius:9px;box-shadow:var(--shadow-sm)}
  .appbar .bn{font-weight:800;font-size:1rem;letter-spacing:-.01em}
  .appbar .bn small{display:block;font-weight:600;font-size:.72rem;color:var(--muted);letter-spacing:.01em}

  h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:8px 2px 2px}
  .sub{color:var(--muted);font-size:.9rem;margin:0 2px 18px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:18px;margin-bottom:16px}

  label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:0 0 7px;letter-spacing:.01em}
  .lblrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
  .lblrow label{margin:0}
  input,select,textarea{
    width:100%;font-size:1.05rem;font-family:inherit;color:var(--text);
    background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--r-sm);
    padding:14px;outline:none;transition:border-color .15s, background .15s;}
  input::placeholder{color:var(--faint)}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
  input[type=number]{appearance:none}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{margin-bottom:16px}
  .field:last-child{margin-bottom:0}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
  .chip{background:var(--accent-soft);border:1px solid transparent;color:var(--accent);
    border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:700;cursor:pointer}
  .chip:active{transform:scale(.96)}
  .linkbtn{background:none;border:none;color:var(--accent);font-weight:700;font-size:.82rem;
    cursor:pointer;padding:4px 2px;display:flex;align-items:center;gap:4px}

  /* ingredients */
  .ingrow{background:var(--surface-2);border-radius:var(--r-sm);padding:12px;margin-bottom:10px}
  .ingrow .ing-name{background:var(--surface);margin-bottom:9px;padding:11px 12px;font-size:1rem}
  .ingline2{display:grid;grid-template-columns:1fr 14px 1fr 14px minmax(68px,auto) 26px;gap:6px;align-items:center}
  .ingline2 input{background:var(--surface);padding:10px 8px;font-size:.95rem;text-align:center}
  .ingline2 .op{color:var(--faint);font-weight:800;text-align:center;font-size:.9rem}
  .ing-total{font-weight:800;font-size:.95rem;text-align:right;white-space:nowrap;color:var(--text)}
  .ing-del{background:none;border:none;color:var(--faint);font-size:1.35rem;cursor:pointer;padding:0;line-height:1}
  .ing-del:active{color:var(--red-text)}
  .addline{background:transparent;border:1.5px dashed var(--line);color:var(--accent);
    border-radius:var(--r-sm);padding:12px;font-weight:700;font-size:.9rem;width:100%;cursor:pointer}
  .addline:active{background:var(--accent-soft)}
  .costtotal{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;
    padding-top:14px;border-top:1px solid var(--line);font-weight:700;color:var(--muted);font-size:.9rem}
  .costtotal b{font-size:1.2rem;color:var(--text)}

  /* live result */
  .result{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin:16px 0 4px;
    background:var(--surface-2);border-radius:var(--r-sm);padding:16px 14px}
  .result .k{font-size:.68rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
  .result .v{font-size:1.25rem;font-weight:800;margin-top:4px;letter-spacing:-.02em}
  .result .v.sm{font-size:1.1rem}
  .pos{color:var(--green)} .neg{color:var(--red-text)} .pend{color:var(--faint);font-weight:800}
  .opt{font-size:.72rem;color:var(--faint);font-weight:700}
  .sublbl{font-size:.74rem}

  button.primary{width:100%;background:var(--accent);color:var(--accent-ink);border:none;
    border-radius:var(--r-sm);padding:16px;font-size:1.05rem;font-weight:800;cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 8px 20px rgba(236,72,153,.3);margin-top:16px}
  button.primary:active{transform:translateY(1px)}
  button.primary:disabled{opacity:.55;box-shadow:none}

  /* records hero */
  .hero{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);
    color:#fff;border-radius:var(--r);padding:20px;box-shadow:0 12px 30px rgba(236,72,153,.32);margin-bottom:14px}
  .hero .cap{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
  .hero .big{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px;line-height:1}
  .hero .sub2{display:flex;gap:16px;font-size:.85rem;opacity:.95;margin-top:10px;flex-wrap:wrap}
  .hero .sub2 b{font-weight:800}
  .hero .mbadge{display:inline-block;background:rgba(255,255,255,.22);border-radius:999px;
    padding:3px 11px;font-weight:800;font-size:.8rem}

  .seg{display:flex;background:var(--surface-2);border-radius:var(--r-sm);padding:4px;gap:4px;margin-bottom:14px}
  .seg button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:700;
    font-size:.84rem;padding:9px 4px;border-radius:10px;cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

  .toolbar{display:flex;justify-content:flex-end;margin-bottom:10px}
  .pdfbtn{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:999px;
    padding:9px 16px;font-size:.84rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow-sm)}
  .pdfbtn:active{transform:scale(.97)}
  .pdfbtn svg{width:15px;height:15px}

  /* chart */
  .barwrap{display:flex;align-items:flex-end;gap:6px;height:116px;margin:2px}
  .bar{flex:1 0 12px;min-width:12px;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
  .bar .col{width:70%;border-radius:6px 6px 0 0;background:linear-gradient(var(--accent-2),var(--accent));min-height:4px;transition:height .3s}
  .bar .col.neg{background:var(--red-soft);border:1px solid var(--red)}
  .bar .lbl{font-size:.6rem;color:var(--faint);font-weight:600}
  .ctitle{font-size:.72rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}

  /* day groups */
  .day h3{font-size:.85rem;margin:20px 4px 10px;color:var(--muted);font-weight:700;
    display:flex;justify-content:space-between;align-items:baseline}
  .day h3 .dp{font-weight:800;font-size:.95rem}
  .item{display:flex;align-items:flex-start;gap:12px;padding:15px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:9px;box-shadow:var(--shadow-sm)}
  .item .name{font-weight:700;font-size:1.02rem}
  .item .meta{font-size:.82rem;color:var(--muted);margin-top:3px}
  .item .ingline{font-size:.76rem;color:var(--faint);margin-top:4px;line-height:1.4}
  .item .amt{margin-left:auto;text-align:right;white-space:nowrap}
  .item .amt .p{font-weight:800;font-size:1.05rem}
  .item .amt .m{font-size:.76rem;color:var(--muted);margin-top:2px}
  .pendbanner{background:var(--accent-soft);border:1px solid var(--line);color:var(--accent);
    border-radius:var(--r-sm);padding:11px 14px;font-size:.82rem;font-weight:700;margin-bottom:14px;line-height:1.4}
  .pendbanner b{color:var(--accent)}
  .item.pending{border-style:dashed;border-color:var(--accent-2);background:var(--accent-soft)}
  .pendbadge{display:inline-block;font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
    color:var(--accent);background:var(--surface);border:1px solid var(--accent-2);border-radius:999px;padding:2px 8px;vertical-align:middle;margin-left:4px}
  .addsales{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;
    font-weight:800;font-size:.78rem;padding:8px 14px;cursor:pointer;white-space:nowrap}
  .addsales:active{opacity:.85}
  .salesedit{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .salesedit input{flex:1;min-width:110px}
  .salesedit .es-save{background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r-sm);
    font-weight:800;font-size:.82rem;padding:0 16px;cursor:pointer;flex:1;min-width:110px}
  .del{background:none;border:none;color:var(--faint);font-size:1.3rem;padding:2px 0 2px 8px;cursor:pointer;line-height:1;align-self:center}
  .del:active{color:var(--red-text)}
  .rowbtns{display:flex;flex-direction:column;align-items:center;gap:2px;align-self:center;margin-left:4px}
  .edit{background:none;border:none;color:var(--faint);font-size:.95rem;padding:2px 4px;cursor:pointer;line-height:1}
  .edit:active{color:var(--accent)}
  .rowbtns .del{padding:2px 4px;align-self:center}
  .editbar{background:var(--accent-soft);border:1px solid var(--accent-2);color:var(--accent);
    border-radius:var(--r-sm);padding:10px 14px;font-size:.85rem;font-weight:700;margin:0 2px 16px;line-height:1.5}
  .editbar .linkbtn{margin-left:4px}

  .empty{text-align:center;color:var(--muted);padding:44px 16px}
  .empty .em{font-size:2.6rem;display:block;margin-bottom:10px}
  .empty b{color:var(--text);font-weight:800;display:block;margin-bottom:4px;font-size:1.05rem}

  /* bottom nav */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:8px 16px calc(10px + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .tabs .wrap{display:flex;gap:8px;max-width:520px;margin:0 auto}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);font-weight:700;font-size:.72rem;
    padding:7px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabs button .ic{width:22px;height:22px;display:block}
  .tabs button.on{color:var(--accent)}

  .hidden{display:none}
  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
    background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;font-size:.9rem;
    opacity:0;transition:.25s;pointer-events:none;z-index:60;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* export sheet */
  .sheet{position:fixed;inset:0;z-index:65;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(20,12,6,.38);opacity:0;transition:opacity .2s}
  .sheet.show{opacity:1}
  .sheet[hidden]{display:none}
  .sheet-card{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;
    padding:18px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow);
    transform:translateY(24px);transition:transform .25s cubic-bezier(.2,1,.4,1)}
  .sheet.show .sheet-card{transform:none}
  .sheet-title{font-weight:800;font-size:1.1rem;margin:2px 4px 16px}
  .sheet-title span{color:var(--muted);font-weight:600}
  .sheet-opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface-2);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;margin-bottom:10px;cursor:pointer}
  .sheet-opt:active{border-color:var(--accent);background:var(--accent-soft)}
  .sheet-opt .emo{font-size:1.4rem;flex:0 0 auto}
  .sheet-opt .tx b{display:block;font-size:1rem;font-weight:800;color:var(--text)}
  .sheet-opt .tx span{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
  .sheet-cancel{width:100%;background:none;border:none;color:var(--muted);font-weight:700;padding:12px;cursor:pointer;font-size:.95rem;margin-top:2px}

  /* success peak */
  .success{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
    background:rgba(20,12,6,.28);opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(2px)}
  .success.show{opacity:1}
  .success .ring{width:96px;height:96px;border-radius:50%;background:var(--surface);
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transform:scale(.6);transition:transform .35s cubic-bezier(.2,1.4,.5,1)}
  .success.show .ring{transform:scale(1)}
  .success svg{width:52px;height:52px;stroke:var(--green);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .success .chk{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s .12s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="appbar">
  <img src="icon-192.png" alt="">
  <div class="bn">Kitchen Profit</div>
</header>

<main>
<!-- ADD -->
<section id="view-add">
  <h1 id="addTitle">Add today's dish</h1>
  <p class="sub">Enter the cost now. Add sales after you've sold.</p>
  <div class="editbar" id="editBar" hidden>✏️ Editing entry — change anything, then <b>Update</b>. <button class="linkbtn" id="cancelEdit" type="button">Cancel</button></div>
  <div class="card">
    <div class="field">
      <div class="lblrow">
        <label for="item">Item</label>
        <button class="linkbtn" id="repeatBtn" type="button">↩︎ Repeat last</button>
      </div>
      <div class="chips" id="chips"></div>
      <input id="item" placeholder="e.g. Lunch Biriyani" autocomplete="off">
    </div>
    <div class="field">
      <label for="date">Date</label>
      <input id="date" type="date">
    </div>
    <div class="field">
      <label>Ingredients &amp; costs (<span class="cur">MVR</span>)</label>
      <div id="ings"></div>
      <button class="addline" id="addIng" type="button">+ Add ingredient / cost</button>
      <div class="costtotal">Total cost <b class="num" id="costTotal">MVR 0</b></div>
    </div>
    <div class="field">
      <div class="lblrow">
        <label>Sales</label>
        <span class="opt">optional — add after you've sold</span>
      </div>
      <div class="row">
        <div>
          <label for="qty" class="sublbl">Plates sold</label>
          <input id="qty" class="num" type="number" inputmode="decimal" placeholder="later" min="0">
        </div>
        <div>
          <label for="price" class="sublbl">Price / plate (<span class="cur">MVR</span>)</label>
          <input id="price" class="num" type="number" inputmode="decimal" placeholder="later" min="0">
        </div>
      </div>
    </div>
    <div class="result">
      <div><div class="k">Sales</div><div class="v sm num" id="pvSales">—</div></div>
      <div><div class="k">Profit</div><div class="v num" id="pvProfit">—</div></div>
      <div><div class="k">Margin</div><div class="v sm num" id="pvMargin">—</div></div>
    </div>
    <button class="primary" id="saveBtn">Save dish</button>
  </div>
</section>

<!-- RECORDS -->
<section id="view-history" class="hidden">
  <h1>Records</h1>
  <p class="sub">Your profit, day by day.</p>
  <div class="seg" id="range">
    <button data-r="today" class="on">Today</button>
    <button data-r="week">7 days</button>
    <button data-r="month">Month</button>
    <button data-r="all">All</button>
  </div>
  <div class="hero">
    <div class="cap">Profit · <span id="hLabel">Today</span></div>
    <div class="big num" id="hProfit">—</div>
    <div class="sub2">
      <span>Sales <b class="num" id="hSales">—</b></span>
      <span>Cost <b class="num" id="hCost">—</b></span>
      <span class="mbadge num" id="hMargin">—</span>
    </div>
  </div>
  <div class="toolbar">
    <button class="pdfbtn" id="pdfBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 21h14"/></svg>
      Export PDF
    </button>
  </div>
  <div id="chart" class="card hidden"></div>
  <div id="list"></div>
</section>
</main>

<nav class="tabs"><div class="wrap">
  <button data-v="add" class="on">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Add
  </button>
  <button data-v="history">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5m5 14V9m5 10V7m5 12V12"/></svg>
    Records
  </button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="sheet-card">
  <div class="sheet-title">Export PDF <span id="sheetRange"></span></div>
  <button class="sheet-opt" data-t="profit"><span class="emo">📈</span><span class="tx"><b>Overall profit report</b><span>Summary + profit per dish &amp; day</span></span></button>
  <button class="sheet-opt" data-t="sales"><span class="emo">💰</span><span class="tx"><b>Sales report — detailed</b><span>Plates, price and sales per dish</span></span></button>
  <button class="sheet-opt" data-t="cost"><span class="emo">🧾</span><span class="tx"><b>Cost report — detailed</b><span>Ingredient breakdown per dish</span></span></button>
  <button class="sheet-opt" data-t="full"><span class="emo">📊</span><span class="tx"><b>Full report — all details</b><span>Profit, sales and ingredient costs</span></span></button>
  <button class="sheet-cancel" id="sheetCancel">Cancel</button>
</div></div>

<div class="toast" id="toast"></div>
<div class="success" id="success"><div class="ring">
  <svg viewBox="0 0 52 52"><path class="chk" d="M14 27l8 8 16-17"/></svg>
</div></div>

<script>
const SB_URL = 'https://yqhbuagckpwqzsmrikuq.supabase.co';

// ---------- ingredients ----------
function ingRow(name='',qty='',price=''){
  const d=document.createElement('div'); d.className='ingrow';
  d.innerHTML=`<input class="ing-name" placeholder="Ingredient (e.g. Rice, Gas…)" autocomplete="off">
    <div class="ingline2">
      <input class="ing-qty num" type="number" inputmode="decimal" placeholder="Qty" min="0">
      <span class="op">×</span>
      <input class="ing-price num" type="number" inputmode="decimal" placeholder="Price" min="0">
      <span class="op">=</span>
      <span class="ing-total num">${money(0)}</span>
      <button class="ing-del" type="button" aria-label="Remove">×</button>
    </div>`;
  d.querySelector('.ing-name').value=name;
  d.querySelector('.ing-qty').value=qty;
  d.querySelector('.ing-price').value=price;
  const upd=()=>{ const t=(+d.querySelector('.ing-qty').value||0)*(+d.querySelector('.ing-price').value||0);
    d.querySelector('.ing-total').textContent=money(t); calc(); };
  d.querySelector('.ing-del').onclick=()=>{ d.remove(); if(!$('#ings').children.length) ingRow(); calc(); };
  d.querySelectorAll('input').forEach(i=>i.addEventListener('input',upd));
  $('#ings').appendChild(d); upd(); return d;
}
const getIngredients=()=>[...$$('#ings .ingrow')].map(r=>{
  const name=r.querySelector('.ing-name').value.trim();
  const qty=+r.querySelector('.ing-qty').value||0, price=+r.querySelector('.ing-price').value||0;
  return {name, qty, price, cost:qty*price};
}).filter(x=>x.name||x.cost);
const ingTotal=()=>getIngredients().reduce((a,b)=>a+b.cost,0);
const resetIngs=()=>{ $('#ings').innerHTML=''; ingRow(); };
$('#addIng').onclick=()=>ingRow();

function calc(){
  const qty=+$('#qty').value||0, price=+$('#price').value||0, cost=ingTotal();
  $('#costTotal').textContent=money(cost);
  const hasSales = qty>0 || price>0;
  const sales=qty*price, profit=sales-cost, margin=sales?profit/sales*100:NaN;
  $('#pvSales').textContent = hasSales?money(sales):'—';
  const pp=$('#pvProfit');
  if(!hasSales){ pp.textContent='later'; pp.className='v num pend'; }
  else { pp.textContent=money(profit); pp.className='v num '+(profit>=0?'pos':'neg'); }
  const pm=$('#pvMargin');
  if(!hasSales){ pm.textContent='—'; pm.className='v sm num pend'; }
  else { pm.textContent=sales?pct(margin):'—'; pm.className='v sm num '+(profit>=0?'pos':'neg'); }
  $('#saveBtn').textContent = editId ? 'Update dish' : (hasSales ? 'Save dish' : 'Save cost · add sales later');
}
['qty','price'].forEach(id=>$('#'+id).addEventListener('input',calc));

// ---------- ingredient persistence (works with OR without the jsonb column) ----------
const ING_TAG='__ings:';                       // marker prefix when breakdown lives in notes
const encodeIngsToNotes=ings=>ings.length?ING_TAG+JSON.stringify(ings):null;
function readIngs(e){                           // normalise a loaded row -> e.ingredients array
  if(Array.isArray(e.ingredients)&&e.ingredients.length) return e.ingredients;
  if(typeof e.notes==='string'&&e.notes.startsWith(ING_TAG)){
    try{ const a=JSON.parse(e.notes.slice(ING_TAG.length)); if(Array.isArray(a)) return a; }catch{}
  }
  return [];
}

// ---------- save (insert new OR update when editing) ----------
let editId=null;
function clearForm(){ ['item','qty','price'].forEach(id=>$('#'+id).value=''); $('#date').value=today(); resetIngs(); }
function startEdit(id){
  const e=cache.find(x=>String(x.id)===String(id)); if(!e) return;
  editId=id;
  $('#item').value=e.item_name||''; $('#date').value=e.entry_date||today();
  $('#qty').value=(+e.qty)||''; $('#price').value=(+e.unit_price)||'';
  $('#ings').innerHTML='';
  const ings=(e.ingredients&&e.ingredients.length)?e.ingredients:null;
  if(ings) ings.forEach(i=>ingRow(i.name||'', i.qty??'', i.price??'')); else ingRow();
  $('#editBar').hidden=false; $('#addTitle').textContent='Edit dish';
  calc(); show('add'); window.scrollTo(0,0);
}
function cancelEdit(){ editId=null; $('#editBar').hidden=true; $('#addTitle').textContent="Add today's dish"; clearForm(); calc(); }
$('#cancelEdit').onclick=cancelEdit;

$('#saveBtn').onclick=async()=>{
  const ings=getIngredients();
  const base={ entry_date:$('#date').value||today(), item_name:$('#item').value.trim(),
    qty:+$('#qty').value||0, unit_price:+$('#price').value||0,
    total_cost:ings.reduce((a,b)=>a+b.cost,0) };
  if(!base.item_name){ toast('Add an item name'); $('#item').focus(); return; }
  $('#saveBtn').disabled=true;
  // prefer the real jsonb column; if it's absent, keep the breakdown in notes
  const run=payload=> editId
    ? sb.from('entries').update(payload).eq('id',editId)
    : sb.from('entries').insert(payload);
  let {error}=await run({...base, ingredients:ings, notes:null});
  if(error && /ingredients/i.test(error.message)){
    ({error}=await run({...base, notes:encodeIngsToNotes(ings)}));
  }
  $('#saveBtn').disabled=false;
  if(error){ toast('Error: '+error.message); return; }
  const wasEdit=!!editId; editId=null; $('#editBar').hidden=true; $('#addTitle').textContent="Add today's dish";
  clearForm(); calc(); celebrate();
  await load(); setTimeout(()=>show('history'),650);
  if(wasEdit) toast('Updated');
};

// ---------- load + render ----------
async function load(){
  const {data,error}=await sb.from('entries').select('*')
    .order('entry_date',{ascending:false}).order('created_at',{ascending:false}).limit(1000);
  if(error){ toast('Load error'); return; }
  cache=(data||[]).map(e=>({ ...e, ingredients:readIngs(e) }));
  renderChips(); render();
}
function renderChips(){
  const out=[]; for(const e of cache){ if(!out.includes(e.item_name)) out.push(e.item_name); if(out.length>=4) break; }
  $('#chips').innerHTML=out.map(n=>`<button class="chip" type="button">${esc(n)}</button>`).join('');
  $$('#chips .chip').forEach(c=>c.onclick=()=>{$('#item').value=c.textContent; const f=$('#ings .ing-name'); if(f) f.focus();});
}
$$('#range button').forEach(b=>b.onclick=()=>{$$('#range button').forEach(x=>x.classList.remove('on'));b.classList.add('on');RANGE=b.dataset.r;render();});
const RLABEL={today:'Today',week:'Last 7 days',month:'This month',all:'All time'};
function inRange(d){
  const t=today();
  if(RANGE==='today') return d===t;
  if(RANGE==='all') return true;
  if(RANGE==='week'){const diff=(new Date(t)-new Date(d))/864e5; return diff>=0&&diff<7;}
  if(RANGE==='month') return d.slice(0,7)===t.slice(0,7);
  return true;
}
const hasSales=e=>(+e.qty>0)||(+e.unit_price>0);
function grouped(){
  const rows=cache.filter(e=>inRange(e.entry_date)); let S=0,C=0,pend=0; const byDay={};
  for(const e of rows){ const sales=(+e.qty)*(+e.unit_price),cost=+e.total_cost, done=hasSales(e);
    if(done){ S+=sales; C+=cost; } else pend++;
    (byDay[e.entry_date]||=[]).push({...e,sales,cost,profit:sales-cost,done}); }
  return {byDay,S,C,P:S-C,pend};
}

            <div class="name">${esc(e.item_name)} <span class="pendbadge">awaiting sales</span></div>
            <div class="meta num">cost ${money(e.cost)}</div>
            ${ingline}
            <div class="salesedit" hidden>
              <input class="es-qty num" type="number" inputmode="decimal" placeholder="Plates sold" min="0">
              <input class="es-price num" type="number" inputmode="decimal" placeholder="Price/plate" min="0">
              <button class="es-save" type="button">Save sales</button>

          </div>

        }

          <div class="name">${esc(e.item_name)}</div>
          <div class="meta num">${(+e.qty)||0}× @ ${money(e.unit_price)} · cost ${money(e.cost)}</div>
          ${ingline}

    const {error}=await sb.from('entries').update({qty,unit_price:price}).eq('id',id);

    if(error){ toast('Save failed: '+error.message); return; }
    toast('Sales added'); celebrate(); await load();
  });
  $$('.edit').forEach(b=>b.onclick=()=>startEdit(b.dataset.id));
  $$('.del').forEach(b=>b.onclick=async()=>{
    if(!confirm('Delete this entry?'))return;
    const {error}=await sb.from('entries').delete().eq('id',b.dataset.id);
    if(error){toast('Delete failed');return;} toast('Deleted'); await load();
  });

function renderChart(byDay){
  const el=$('#chart'), days=Object.keys(byDay).sort().slice(-14);
  if(days.length<2){ el.classList.add('hidden'); el.innerHTML=''; return; }
  el.classList.remove('hidden');
  const prof=days.map(d=>byDay[d].filter(x=>x.done).reduce((a,b)=>a+b.profit,0)), max=Math.max(1,...prof.map(Math.abs));
  el.innerHTML=`<div class="ctitle">Daily profit · last ${days.length} days</div><div class="barwrap">${
    days.map((d,i)=>{const p=prof[i],h=Math.max(4,Math.abs(p)/max*90);
      return `<div class="bar" title="${prettyDate(d)}: ${money(p)}"><div class="col ${p<0?'neg':''}" style="height:${h}px"></div><div class="lbl">${new Date(d).getDate()}</div></div>`;
    }).join('')}</div>`;
}

const lineTotal=i => i.cost!=null ? i.cost : ((+i.qty||0)*(+i.price||0));
const allItems=g => Object.values(g).flat();

function buildPDF(type){
  const {byDay,S,C,P}=grouped();
  const days=Object.keys(byDay).sort().reverse();
  if(!days.length){ toast('Nothing to export'); return; }
  // cost is known at cook time, so the cost report covers every dish; the others need a finalised sale
  const anyDone=allItems(byDay).some(e=>e.done);
  if(type!=='cost' && !anyDone){ toast('No completed sales yet — add sales first'); return; }
  const Ca=allItems(byDay).reduce((a,b)=>a+(+b.cost||0),0);   // total cost incl. awaiting-sales dishes
  const dishCount=allItems(byDay).length;
  if(!(window.jspdf&&window.jspdf.jsPDF)){ toast('PDF still loading, try again'); return; }
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF('p','pt','a4');
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=40;
  const AC=[236,72,153], INK=[36,29,25], SUB=[90,78,66], MUT=[138,126,113], GRN=[21,128,61], RED=[185,28,28];
  const TITLES={profit:'Profit report',sales:'Sales report — detailed',cost:'Cost report — detailed',full:'Full report — all details'};
  const title=TITLES[type]||'Report';

  const header=()=>{
    doc.setFillColor(...AC); doc.rect(0,0,W,92,'F');
    doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(18);
    doc.text('Kitchen Profit',M,42);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    doc.text(title+'  ·  '+RLABEL[RANGE],M,62);
    doc.text('Generated '+new Date().toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}),M,78);
  };
  header();
  let y=116;

  // summary tiles (per report type)
  const plates=allItems(byDay).reduce((a,b)=>a+(+b.qty||0),0);
  let tiles;
  if(type==='sales') tiles=[['SALES',money(S),INK],['PLATES',String(plates),INK],['AVG / PLATE',money(plates?S/plates:0),INK],['DAYS',String(days.length),INK]];
  else if(type==='cost') tiles=[['TOTAL COST',money(Ca),INK],['DISHES',String(dishCount),INK],['AVG / DISH',money(dishCount?Ca/dishCount:0),INK],['DAYS',String(days.length),INK]];
  else tiles=[['SALES',money(S),INK],['COST',money(C),INK],['PROFIT',money(P),P<0?RED:GRN],['MARGIN',S?pct(P/S*100):'—',P<0?RED:GRN]];
  const tw=(W-2*M-3*10)/4;
  tiles.forEach((t,i)=>{ const x=M+i*(tw+10);
    doc.setFillColor(245,239,232); doc.roundedRect(x,y,tw,58,8,8,'F');
    doc.setTextColor(...MUT); doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text(t[0],x+10,y+20);
    doc.setTextColor(...t[2]); doc.setFontSize(12); doc.text(String(t[1]),x+10,y+42);
  });
  y+=58+22;

  const base={ margin:{left:M,right:M},
    styles:{font:'helvetica',fontSize:9,cellPadding:6,textColor:INK,lineColor:[236,226,213],lineWidth:.5},
    headStyles:{fillColor:INK,textColor:[255,255,255],fontStyle:'bold',fontSize:8},
    alternateRowStyles:{fillColor:[250,247,242]}, didDrawPage:()=>header() };
  const subTbl={ styles:{font:'helvetica',fontSize:8,cellPadding:4,textColor:INK,lineColor:[236,226,213],lineWidth:.5},
    headStyles:{fillColor:SUB,textColor:[255,255,255],fontStyle:'bold',fontSize:7}, didDrawPage:()=>header() };
  const ensure=need=>{ if(y>H-need){ doc.addPage(); header(); y=116; } };
  const dayHead=(d,amt,col)=>{ ensure(96);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...INK);
    doc.text(new Date(d).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short',year:'numeric'}),M,y);
    if(amt!=null){ doc.setTextColor(...col); doc.text(amt,W-M,y,{align:'right'}); } y+=8; };
  const ingBody=items=>items; // placeholder
  const ingTable=e=>{
    const rows=(e.ingredients&&e.ingredients.length)
      ? e.ingredients.map(i=>[i.name||'—', i.qty!=null?String(i.qty):'', i.price!=null?money(i.price):'', money(lineTotal(i))])
      : [['No itemised breakdown','','',money(e.cost)]];
    doc.autoTable({...subTbl, startY:y, head:[['Ingredient','Qty','Unit price','Line total']], body:rows,
      columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right',fontStyle:'bold'}}});
    y=doc.lastAutoTable.finalY;
  };

  days.forEach(d=>{
    // cost report shows every dish; profit/sales/full need a finalised sale
    const items=(type==='cost') ? byDay[d] : byDay[d].filter(e=>e.done);
    if(!items.length) return;
    if(type==='sales'){
      dayHead(d, money(items.reduce((a,b)=>a+b.sales,0)), GRN);
      doc.autoTable({...base, startY:y, head:[['Item','Plates','Price / plate','Sales']],
        body:items.map(e=>[e.item_name,String(+e.qty||0),money(e.unit_price),money(e.sales)]),
        columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right',fontStyle:'bold'}}});
      y=doc.lastAutoTable.finalY+20;
    } else if(type==='cost'){
      dayHead(d, money(items.reduce((a,b)=>a+b.cost,0)), RED);
      items.forEach(e=>{ ensure(84);
        doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...INK); doc.text(e.item_name,M,y);
        doc.setFont('helvetica','normal'); doc.setTextColor(...MUT); doc.text('total cost '+money(e.cost),W-M,y,{align:'right'}); y+=6;
        ingTable(e); y+=14;
      }); y+=6;
    } else if(type==='full'){
      dayHead(d, money(items.reduce((a,b)=>a+b.profit,0)), items.reduce((a,b)=>a+b.profit,0)<0?RED:GRN);
      doc.autoTable({...base, startY:y, head:[['Item','Plates','Price','Sales','Cost','Profit','Margin']],
        body:items.map(e=>[e.item_name,String(+e.qty||0),money(e.unit_price),money(e.sales),money(e.cost),money(e.profit),pct(e.sales?e.profit/e.sales*100:NaN)]),
        columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right',fontStyle:'bold'},6:{halign:'right'}}});
      y=doc.lastAutoTable.finalY+10;
      items.forEach(e=>{ if(!(e.ingredients&&e.ingredients.length)) return; ensure(72);
        doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(...MUT); doc.text('Ingredients — '+e.item_name,M,y); y+=4;
        ingTable(e); y+=12;
      }); y+=8;
    } else { // profit
      dayHead(d, money(items.reduce((a,b)=>a+b.profit,0)), items.reduce((a,b)=>a+b.profit,0)<0?RED:GRN);
      doc.autoTable({...base, startY:y, head:[['Item','Plates','Price','Sales','Cost','Profit','Margin']],
        body:items.map(e=>[e.item_name,String(+e.qty||0),money(e.unit_price),money(e.sales),money(e.cost),money(e.profit),pct(e.sales?e.profit/e.sales*100:NaN)]),
        columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right',fontStyle:'bold'},6:{halign:'right'}}});
      y=doc.lastAutoTable.finalY+20;
    }
  });

  // grand totals
  ensure(70);
  doc.setDrawColor(...AC); doc.setLineWidth(1); doc.line(M,y,W-M,y); y+=18;
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...INK);
  let gt;
  if(type==='sales') gt='Total sales: '+money(S)+'    ·    '+plates+' plates';
  else if(type==='cost') gt='Total cost: '+money(Ca)+'    ·    '+dishCount+' dish'+(dishCount>1?'es':'');
  else gt='Totals —  Sales '+money(S)+'    Cost '+money(C)+'    Profit '+money(P)+'    Margin '+(S?pct(P/S*100):'—');
  doc.text(gt,M,y);

  const n=doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUT);
    doc.text('Kitchen Profit',M,H-20); doc.text(`Page ${i} of ${n}`,W-M,H-20,{align:'right'}); }
  doc.save(`Kitchen-${type}-${RANGE}-${today()}.pdf`);
  toast('PDF ready');
}

// ---------- nav + init ----------
function show(v){
  ['add','history'].forEach(x=>$('#view-'+x).classList.toggle('hidden',x!==v));
  $$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  window.scrollTo(0,0);
  if(v==='history') render();
}
$$('.tabs button').forEach(b=>b.onclick=()=>{ if(b.dataset.v==='add'&&editId) cancelEdit(); show(b.dataset.v); });

(function init(){
  $('#date').value=today();
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  resetIngs(); calc(); load();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
